[Section 1: Sar Control]
# iwnpi wlan0 set_sar_power [sar_type] [power_value] [phy_mode] [reserved]

# sar_type：指功率降低的类型，降低绝对值或者降低相对值功率
# sar_type = 0: 表示恢复TX Power默认值
# sar_type = 1:  降低的功率值为：绝对功率值，步进为1dB，比如降低到10dBm
# sar_type = 2:  降低的功率值为：相对于默认功率的相对降低值，步进为1dB，比如降低5dB，指相对于默认功率降低5dB

# power_value：指需要降低的具体数值
# power_value配置为0x7F表示恢复TX Power默认值

# phy_mode
# 0：2G 11b
# 1：2G 11g
# 2：2G 11n
# 3：2G 11ac
# 4：5G 11a
# 5：5G 11n
# 6：5G 11ac
# 7：ALL phy mode

Table0 = 0,0x7f,7
Table2 = 2,1,4,2,1,5,2,1,6
Table4 = 2,1,0,2,1,1,2,1,2
Table6 = 2,1,4,2,1,5,2,1,6
